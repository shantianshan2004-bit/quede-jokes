/* 这条评论是不是我自己发的：优先认身份 ID，兼容早期只有昵称的数据 */
function isMine(cm) {
  const m = User.me;
  if (!m || !cm) return false;
  return cm.uid ? cm.uid === m.id : cm.who === m.nick;
}
function timeAgo(t) {
  const d = Date.now() - t;
  if (d < 6e4) return "刚刚";
  if (d < 36e5) return Math.round(d / 6e4) + " 分钟前";
  if (d < 864e5) return Math.round(d / 36e5) + " 小时前";
  return Math.round(d / 864e5) + " 天前";
}

/* ============================================================================
   10. 归档流水线 —— 四个阶段，全部做真事
   ========================================================================== */
const STAGES = [
  { key:"read", name:"读取图像", icon:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.8" y="2.6" width="12.4" height="10.8" rx="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M1.8 10l3.4-3 2.6 2.4 2.6-2.8 3 3.2" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>' },
  { key:"ocr",  name:"提取文字", icon:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.6 3.4h10.8M2.6 7h10.8M2.6 10.6h7.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' },
  { key:"cls",  name:"理解与归类", icon:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.9l1.5 3.6L13 7l-3.5 1.5L8 12.1 6.5 8.5 3 7l3.5-1.5L8 1.9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>' },
  { key:"save", name:"归入图墙", icon:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 6.4h10M3 9.6h10M6.4 3v10M9.6 3v10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>' }
];

function buildPipeline(host) {
  host.innerHTML = STAGES.map(s => `
    <div class="stage" data-k="${s.key}" data-state="idle">
      <div class="icon">${s.icon}</div>
      <div class="body">
        <p class="name">${s.name}</p>
        <p class="out"></p>
        <div class="rail"><i></i></div>
      </div>
    </div>`).join("");
}
function stage(k) { return $('#pipeStages .stage[data-k="' + k + '"]'); }
function setOut(k, text) {
  const el = stage(k); if (!el) return;
  const o = $(".out", el); o.textContent = text; o.classList.add("show");
}
function setRail(k, p) { const el = stage(k); if (el) $(".rail i", el).style.width = clamp(p, 0, 1) * 100 + "%"; }
function setState(k, st) {
  const el = stage(k); if (!el) return;
  el.dataset.state = st;
  if (st === "done") {
    $(".icon", el).innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path class="tick" d="M3.4 8.4l3 3 6-6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    $(".rail", el).style.opacity = 0;
  }
}

async function runPipeline(files) {
  const pipe = $("#pipeline"), scrim = $("#scrim");
  const uploader = User.me;                       // 谁传的，当场记下来
  $("#pipeSub").textContent = files.length > 1 ? `共 ${files.length} 张截图，逐张处理` : "1 张截图";
  $("#pipeHint").textContent = Ocr.enabled ? "识别在本机浏览器里完成，图片不会离开这台设备。" : "文字识别当前关闭，可在 Tweaks 里开启；也能在详情页手动补录文字。";
  $("#pipeSkip").hidden = true; $("#pipeDone").hidden = true;
  $("#pipeSkip").onclick = () => { runPipeline._skip = true; };
  runPipeline._skip = false;
  buildPipeline($("#pipeStages"));
  scrim.classList.add("on");
  // 重置后再入场，保证每次播放都有节奏
  pipe.style.transition = "none"; pipe.classList.remove("on");
  requestAnimationFrame(() => { pipe.style.transition = ""; pipe.classList.add("on"); });
  if (RM.matches) await wait(40); else await wait(180);

  const out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    $("#pipeSub").textContent = files.length > 1 ? `第 ${i + 1} / ${files.length} 张 · ${f.name}` : f.name;

    /* 1 · 读取图像 —— 真实解码 + 缩放 + 主色 + 指纹 */
    setState("read", "active"); setRail("read", .05);
    await wait(140);
    const img = await Img.load(f);
    setRail("read", .7);
    setOut("read", `已解码 ${img.w}×${img.h} · 主色 ${img.colors.length} 个`);
    await wait(160); setRail("read", 1); setState("read", "done");

    /* 2 · 提取文字 —— 真 OCR，或用户手动补录 */
    let text = f._text || "";
    setState("ocr", "active");
    if (text) {
      setRail("ocr", .4); setOut("ocr", "使用已提供的文字"); setRail("ocr", 1);
    } else if (Ocr.enabled && !runPipeline._skip) {
      setOut("ocr", "正在本机识别…");
      try {
        text = await Ocr.run(f, p => setRail("ocr", p));
        setOut("ocr", text.trim() ? `识别到 ${text.replace(/\s/g, "").length} 个字` : "没有识别到文字");
      } catch (e) {
        setOut("ocr", "识别不可用 → 已标记为待归类，可稍后手动补录");
        $("#ocrStatus").textContent = "OCR 不可用：" + e.message + "（可改用手动补录文字）";
      }
      setRail("ocr", 1);
    } else {
      setRail("ocr", .5);
      setOut("ocr", Ocr.enabled ? "已跳过" : "未开启 OCR → 标记为待归类");
      await wait(200); setRail("ocr", 1);
    }
    setState("ocr", "done");

    /* 3 · 理解与归类 —— 真规则引擎 */
    setState("cls", "active"); setRail("cls", .1);
    await wait(150);
    const a = Archive.analyze(text, img);
    setRail("cls", .6);
    setOut("cls", a.hits.length
      ? `命中 ${a.hits.length} 个关键词 → ${a.category.name}`
      : "没有命中关键词 → 待归类");
    await wait(200); setRail("cls", 1);
    setOut("cls", (a.tags.length ? "标签：" + a.tags.join("、") : "暂无标签") + " · " + a.mood);
    setState("cls", "done");

    /* 4 · 归入图墙 */
    setState("save", "active"); setRail("save", .3);
    const rec = {
      id: uid(), at: Date.now(), name: f.name,
      ownerId: uploader ? uploader.id : null, ownerName: uploader ? uploader.nick : "未署名", ownerAv: uploader ? uploader.av : null,
      data: img.dataUrl, w: img.w, h: img.h,
      colors: img.colors, hash: img.hash,
      cat: a.category.key, confidence: a.confidence, hits: a.hits,
      runners: a.runners.slice(1, 3).map(r => r.cat.name), manual: false,
      title: a.title, tags: a.tags, speakers: a.speakers, mood: a.mood,
      isGroup: a.isGroup, text: a.text
    };
    const dup = S.items.find(x => x.hash && img.hash && Img.hamming(x.hash, img.hash) <= 3);
    await Store.put(rec);
    S.items.unshift(rec);
    setRail("save", 1);
    setOut("save", dup ? "已归档 · 和已有的一张很像，可能是重复" : "已归档");
    setState("save", "done");
    out.push(rec);
    if (dup) toast("这张和已有的一张几乎一样，可能是重复上传");
    await wait(220);
  }

  renderFilters(); renderWall(true); applyAmbient();
  $("#pipeHint").textContent = `完成 · 共 ${out.length} 张。分类可以随时在详情里手改。`;
  $("#pipeDone").hidden = false;
  $("#pipeDone").onclick = () => { pipe.classList.remove("on"); scrim.classList.remove("on"); };
  if (RM.matches) { setTimeout(() => { pipe.classList.remove("on"); scrim.classList.remove("on"); }, 700); }
}

/* ============================================================================
   11. 入口：选择 / 拖拽 / 粘贴
   ========================================================================== */
async function ingest(files) {
  if (!files || !files.length) return;
  const arr = Array.prototype.slice.call(files).filter(f => /^image\//.test(f.type));
  if (!arr.length) { toast("只支持图片文件"); return; }
  if (arr.length > 12) { toast("一次最多 12 张，先处理前 12 张"); arr.length = 12; }
  await runPipeline(arr);
}

async function loadSamples(n) {
  const pseudo = [];
  for (let i = 0; i < n; i++) {
    const s = Sample.make(S.items.length + i, i === 1);   // 第二张做成「长截图」
    const blob = await (await fetch(s.dataUrl)).blob();
    const f = new File([blob], s.name, { type: "image/jpeg" });
    f._text = s.text;                                     // 文字是真的，直接喂给归类引擎
    pseudo.push(f);
  }
  await ingest(pseudo);
}

$("#dockUpload").onclick = $("#emptyUpload").onclick = () => $("#filePick").click();
$("#dockSample").onclick = $("#emptySample").onclick = () => loadSamples(4);
$("#filePick").onchange = e => { ingest(e.target.files); e.target.value = ""; };

document.addEventListener("paste", e => {
  const items = (e.clipboardData || {}).items || [];
  const files = [];
  for (const it of items) if (it.kind === "file" && /^image\//.test(it.type)) {
    const f = it.getAsFile(); if (f) files.push(f);
  }
  if (files.length) { e.preventDefault(); toast("从剪贴板收到 " + files.length + " 张截图"); ingest(files); }
});

let dragN = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragN++; $("#drop").classList.add("on"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", e => { dragN = Math.max(0, dragN - 1); if (!dragN) $("#drop").classList.remove("on"); });
window.addEventListener("drop", e => {
  e.preventDefault(); dragN = 0; $("#drop").classList.remove("on");
  if (e.dataTransfer && e.dataTransfer.files) ingest(e.dataTransfer.files);
});

/* ============================================================================
   12. 导航收缩（液态玻璃的核心行为）+ 指针高光
   ========================================================================== */
let lastY = window.scrollY, ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY;
    const nav = $("#nav");
    if (y > 90 && y > lastY) nav.dataset.shrunk = "1";
    else if (y < lastY - 4 || y < 60) nav.dataset.shrunk = "0";
    lastY = y; ticking = false;
  });
}, { passive:true });

document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest(".glass, .chip, .tool");
  if (!t) return;
  const r = t.getBoundingClientRect();
  t.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%");
  t.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
}, { passive:true });

/* ============================================================================
   13. 交互绑定
   ========================================================================== */
$("#q").addEventListener("input", e => { S.q = e.target.value; renderWall(false); });
$("#shClose").onclick = closeSheet;
$("#shLike").onclick = e => {
  const it = S.items.find(x => x.id === S.openId); if (!it) return;
  toggleLike(it, null, { clientX: e.clientX, clientY: e.clientY });
};
$("#scrim").onclick = () => {
  closeSheet();
  $("#pipeline").classList.remove("on");
  $("#scrim").classList.remove("on");
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSheet(); $("#tweaks").classList.remove("on"); Profile.close(); }
});

/* Tweaks */
$("#dockTweaks").onclick = () => $("#tweaks").classList.toggle("on");
$("#twClose").onclick = () => $("#tweaks").classList.remove("on");
$$("[data-tw]").forEach(seg => {
  const key = seg.dataset.tw;
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const v = b.dataset.v;
    if (key === "theme") {
      document.documentElement.dataset.theme = v;
    } else if (key === "ocr") {
      Ocr.setEnabled(v === "on");
      $("#ocrStatus").textContent = v === "on"
        ? "将联网加载中文模型（首次约 15MB），识别全部在本机完成，图片不上传。"
        : "关闭时，可在详情里手动补录文字，归类引擎照常工作。";
      if (v === "on" && !window.Tesseract) Ocr.ensure().catch(() => {});
    } else {
      document.documentElement.dataset[key] = v;
    }
    $$("button", seg).forEach(x => x.setAttribute("aria-pressed", x === b));
  });
});
$("#ambRange").addEventListener("input", e => {
  document.documentElement.style.setProperty("--ambient-strength", e.target.value / 100);
  $("#ambVal").textContent = e.target.value + "%";
});

/* ============================================================================
   13.5 身份层 —— 进门 + 个人主页
   ========================================================================== */

/* 历史遗留：这次改版之前传的截图没有署名。第一次进门时认领到自己名下，
   否则它们会永远挂在「未署名」上。 */
async function claimOrphans() {
  const m = User.me; if (!m) return 0;
  const orphans = S.items.filter(it => !it.ownerId);
  for (const it of orphans) {
    it.ownerId = m.id; it.ownerName = m.nick; it.ownerAv = m.av;
    await Store.put(it);
  }
  if (orphans.length) { renderFilters(); renderWall(false); }
  return orphans.length;
}

/* 改名 / 换头像之后，把过去的署名一起更新（靠 ID 认，不靠名字认） */
async function syncFootprint(prevNick) {
  const m = User.me; if (!m) return 0;
  let n = 0;
  for (const it of S.items) {
    if (it.ownerId === m.id || (!it.ownerId && prevNick && it.ownerName === prevNick)) {
      it.ownerId = m.id; it.ownerName = m.nick; it.ownerAv = m.av;
      await Store.put(it); n++;
    }
    const meta = Meta.raw(it.id);
    const list = (meta && meta.comments) || [];
    let hit = false;
    list.forEach(c => {
      if (c.uid === m.id || (!c.uid && prevNick && c.who === prevNick)) {
        c.uid = m.id; c.who = m.nick; c.av = m.av; hit = true;
      }
    });
    if (hit) Meta.touch(it.id, { comments: list });
  }
  renderFilters(); renderWall(false);
  if (S.openId) { const o = S.items.find(x => x.id === S.openId); if (o) renderSheet(o, true); }
  return n;
}

const Gate = (() => {
  let av = null;
  function draw() {
    $("#gatePicks").innerHTML = avPickerHTML(av);
    bindAvPicker($("#gatePicks"), a => { av = a; draw(); });
    check();
  }
  function check() { $("#gateEnter").disabled = !$("#gateName").value.trim(); }
  function open() {
    const el = $("#gate"), saved = User.me;
    av = (saved && saved.av) || { type: "emoji", value: User.PRESETS[0] };
    if (saved) $("#gateName").value = saved.nick;
    el.hidden = false;
    draw();
    void el.offsetWidth;                 // 强制回流：保证入场过渡从 opacity:0 出发，不依赖 rAF
    el.classList.add("on");
    setTimeout(() => { try { $("#gateName").focus(); } catch (e) {} }, 430);
  }
  function close() {
    const el = $("#gate");
    el.classList.remove("on");
    setTimeout(() => { el.hidden = true; }, 430);
  }
  async function submit() {
    const nick = $("#gateName").value.trim();
    if (!nick) return;
    const first = !User.me;
    User.save({ nick, av });
    close();
    applyMe();
    const got = first ? await claimOrphans() : 0;
    toast(got ? `欢迎，${nick}。顺手把墙上 ${got} 张没署名的截图认领给你了` : `欢迎，${nick}`, 4200);
  }
  return { open, close, submit, check };
})();

const Profile = (() => {
  let cur = null, tab = "items", draft = null;

  const isMe = p => !!(p && User.me && p.id && p.id === User.me.id);
  const itemsOf = p => p.id
    ? S.items.filter(it => it.ownerId === p.id)
    : S.items.filter(it => !it.ownerId && it.ownerName === p.nick);
  function commentsOf(p) {
    const out = [];
    S.items.forEach(it => {
      const meta = Meta.raw(it.id); if (!meta || !meta.comments) return;
      meta.comments.forEach(c => {
        if (p.id ? c.uid === p.id : (!c.uid && c.who === p.nick)) out.push({ it, c });
      });
    });
    return out.sort((a, b) => b.c.at - a.c.at);
  }

  function open(who) {
    if (!who) {
      const m = User.me;
      if (!m) { Gate.open(); return; }
      who = { id: m.id, nick: m.nick, av: m.av, bio: m.bio, at: m.at };
    }
    cur = who;
    $("#profile").classList.add("on");
    document.body.classList.add("locked");
    draw();
  }
  function close() {
    $("#profile").classList.remove("on");
    document.body.classList.remove("locked");
    cur = null;
  }
  function go(t) { tab = t; draw(); }

  function statsHTML(p, its, cms) {
    const likes = its.reduce((n, it) => n + ((Meta.raw(it.id) && Meta.raw(it.id).likes) || 0), 0);
    const mine = isMe(p);
    const s = [
      { n: its.length, l: mine ? "我传的截图" : "传的截图" },
      { n: likes, l: "收到的赞" },
      { n: cms.length, l: mine ? "我发的评论" : "发过的评论" }
    ];
    if (mine && p.at) s.push({ n: Math.max(1, Math.ceil((Date.now() - p.at) / 864e5)), l: "在这儿的第几天" });
    return `<div class="pf-stats">${s.map(x => `<div class="pf-stat"><b class="num">${x.n}</b><span>${x.l}</span></div>`).join("")}</div>`;
  }

  function editHTML() {
    const m = User.me;
    draft = { av: m.av, nick: m.nick, bio: m.bio || "" };
    return `
      <div class="pf-edit">
        <h4>账号设置</h4>
        <label class="field"><span>昵称</span>
          <input id="edName" maxlength="10" value="${esc(m.nick)}" autocomplete="off">
        </label>
        <p class="field-label">头像</p>
        <div class="avatar-pick" id="edPicks"></div>
        <label class="field"><span>一句话签名（可留空）</span>
          <input id="edBio" maxlength="30" value="${esc(m.bio || "")}" placeholder="比如：专收损友语录" autocomplete="off">
        </label>
        <div class="row">
          <button class="btn" id="edSave">保存</button>
          <button class="btn ghost" id="edCancel">取消</button>
          <button class="btn ghost danger" id="edOut" style="margin-left:auto">退出登录</button>
        </div>
        <p class="pf-note">署名靠身份 ID 关联，不靠名字：改完昵称和头像，你之前传的截图、发过的评论会跟着一起更新。<br>退出登录只清掉这台设备上的身份，墙上的截图不会被删。</p>
      </div>`;
  }

  function bodyHTML(p, its, cms) {
    const mine = isMe(p);
    if (tab === "account" && mine) return editHTML();
    if (tab === "comments") {
      if (!cms.length) return `<p class="pf-empty">${mine ? "你还没评论过。看到好笑的，去留一句。" : "TA 还没评论过。"}</p>`;
      return cms.map(x => `
        <div class="pf-cmt" data-it="${x.it.id}" role="button" tabindex="0">
          <img src="${x.it.data}" alt="">
          <div class="b">
            <p class="w">在《${esc(x.it.title)}》下 · ${timeAgo(x.c.at)}</p>
            <p class="x">${esc(x.c.text)}</p>
          </div>
        </div>`).join("");
    }
    if (!its.length)
      return `<p class="pf-empty">${mine
        ? "你还没传过截图。<br>回到墙上，把手机里那些缺德的对话丢进来。"
        : `这面墙上还没有署名「${esc(p.nick)}」的截图。`}</p>`;
    return `<div class="pf-grid">${its.map((it, i) => {
      const c = catOf(it.cat);
      return `<div class="pf-card" data-it="${it.id}" role="button" tabindex="0" style="--d:${Math.min(i, 12) * 50}ms">
          <img src="${it.data}" alt="${esc(it.title)}" loading="lazy">
          <div class="cap"><p>${esc(it.title)}</p><span>${esc(c.name)} · ${timeAgo(it.at)}</span></div>
        </div>`;
    }).join("")}</div>`;
  }

  function draw() {
    const p = cur; if (!p) return;
    const mine = isMe(p), its = itemsOf(p), cms = commentsOf(p);
    if (tab === "account" && !mine) tab = "items";

    $("#pfHeadTitle").textContent = mine ? "我的主页" : p.nick + " 的主页";
    $("#pfHeadSub").textContent = mine ? "改名、换头像，回看自己传过的所有截图" : "通过截图署名找到的上传者";
    $("#pfEditBtn").hidden = !mine;

    const sub = mine
      ? (p.at ? "进门于 " + new Date(p.at).toLocaleDateString("zh-CN") : "")
      : "署名出现在截图和评论里";
    const tabs = mine
      ? [["items", "我传的 " + its.length], ["comments", "我评论的 " + cms.length], ["account", "账号设置"]]
      : [["items", "TA 传的 " + its.length], ["comments", "TA 的评论 " + cms.length]];

    $("#pfInner").innerHTML = `
      <div class="pf-hero">
        ${avHTML(p.av, 84)}
        <div class="txt">
          <h1 class="pf-name">${esc(p.nick)}${mine ? '<span class="badge">这是你</span>' : ""}</h1>
          ${sub ? `<p class="pf-sub">${esc(sub)}</p>` : ""}
          ${p.bio ? `<p class="pf-bio">${esc(p.bio)}</p>` : ""}
        </div>
      </div>
      ${statsHTML(p, its, cms)}
      <div class="pf-tabs">${tabs.map(t => `<button data-tab="${t[0]}" aria-pressed="${tab === t[0]}">${esc(t[1])}</button>`).join("")}</div>
      <div id="pfBody">${bodyHTML(p, its, cms)}</div>`;

    $$("#pfInner [data-tab]").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
    $$("#pfBody [data-it]").forEach(el => {
      const it = S.items.find(x => x.id === el.dataset.it); if (!it) return;
      const go2 = () => { close(); openSheet(it, el); };
      el.addEventListener("click", go2);
      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go2(); }
      });
    });
    if (tab === "account" && mine) bindEdit();
  }

  function bindEdit() {
    const paint = () => {
      $("#edPicks").innerHTML = avPickerHTML(draft.av);
      bindAvPicker($("#edPicks"), a => { draft.av = a; paint(); });
    };
    paint();

    $("#edSave").addEventListener("click", async () => {
      const nick = $("#edName").value.trim();
      if (!nick) { toast("昵称不能是空的"); return; }
      const prev = User.me.nick;
      User.save({ nick, av: draft.av, bio: $("#edBio").value.trim() });
      applyMe();
      const n = await syncFootprint(prev);
      const m2 = User.me;
      cur = { id: m2.id, nick: m2.nick, av: m2.av, bio: m2.bio, at: m2.at };
      draw();
      toast(n ? `资料已更新，${n} 处署名跟着改了` : "资料已更新");
    });
    $("#edCancel").addEventListener("click", () => draw());
    $("#edOut").addEventListener("click", () => {
      if (!window.confirm("退出后这台设备上的身份会被清掉（墙上的截图不会删）。确定退出？")) return;
      User.logout();
      close(); applyMe();
      setTimeout(() => Gate.open(), 300);
    });
  }

  return { open, close, go };
})();

$("#navMe").addEventListener("click", () => { if (User.me) Profile.open(); else Gate.open(); });
$("#pfBack").addEventListener("click", () => Profile.close());
$("#pfEditBtn").addEventListener("click", () => Profile.go("account"));
$("#gateName").addEventListener("input", () => Gate.check());
$("#gateName").addEventListener("keydown", e => { if (e.key === "Enter") Gate.submit(); });
$("#gateEnter").addEventListener("click", () => Gate.submit());

/* ============================================================================
   14. 启动
   ========================================================================== */
(async function init() {
  $$("[data-tw]").forEach(seg => {
    const key = seg.dataset.tw;
    const cur = key === "ocr" ? (Ocr.enabled ? "on" : "off") : document.documentElement.dataset[key];
    $$("button", seg).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === (cur || "regular")));
  });
  buildPipeline($("#pipeStages"));
  applyMe();

  S.items = await Store.all();
  S.items.sort((a, b) => b.at - a.at);
  renderFilters(); renderWall(true); applyAmbient();

  if (!User.me) setTimeout(() => Gate.open(), 420);

  if (Store.memOnly) {
    setTimeout(() => toast("当前以本地文件方式打开，数据无法长期保存。双击 start-server.bat 打开可保存。", 6000), 900);
  }
})();
</script>
